# Publicacion de la web de Vanguard Tech.
#
# La web es HTML, CSS y JavaScript sin dependencias: no hay nada que compilar.
# La raiz de este repositorio ES la web, asi que no hay carpeta que indicar.
#
# Generado por `vt web export`. No se edita a mano: se edita en
# WEBSITE/generator/export-site.mjs del repositorio principal.

[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    # La web es un solo fichero: el CSS y el JavaScript van dentro del HTML.
    # Por eso el script en linea se autoriza por HUELLA, no con
    # 'unsafe-inline': si alguien inyectase un script, su huella no
    # coincidiria y el navegador no lo ejecutaria.
    # Si se toca el JavaScript hay que regenerarlas. El comando esta en el README.
    Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; script-src 'self' 'sha256-S9d1599g+qtX3OgEhfF/qny4XhfymE8f1kf3XHnjzDY=' 'sha256-BVAWTm4fGjV+D0ehrNJ/kyrL+Znzfb/7WeVSpgtcllw=' 'sha256-0mJCmXCPz+G8BcJiuvYdL/cUErpWYvv6AXpwfIa8vGM='; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"

# Las tipografias no cambian nunca.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Las demos son negocios inventados: no deben competir en buscadores con
# negocios reales de su sector.
[[headers]]
  for = "/work/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
