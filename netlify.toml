# Publicacion de la web de Vanguard Tech.
#
# La web es HTML, CSS y JavaScript sin dependencias: no hay nada que compilar.
# La raiz de este repositorio ES la web, asi que no hay carpeta que indicar.
#
# Generado por `vt web export`. No se edita a mano: se edita en
# WEBSITE/generator/export-site.mjs del repositorio principal.

[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    # La web no carga NADA de terceros: tipografias, fotografias y scripts
    # salen de este dominio. `script-src 'self'` implica que el JavaScript no
    # puede ir en linea: por eso la portada carga /main.js, y las seis demos
    # cargan /fonts/fonts.css en vez de la hoja del CDN de Google, que esta
    # politica bloqueaba sin que se notase.
    Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; script-src 'self'; frame-src 'none'; connect-src 'self'; base-uri 'none'; form-action 'self'"

# Las tipografias no cambian nunca.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Las fotografias llevan el ancho en el nombre (gym-800.webp), asi que cambiar
# una foto es publicar un fichero distinto: se pueden cachear para siempre.
[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Las demos son negocios inventados: no deben competir en buscadores con
# negocios reales de su sector.
[[headers]]
  for = "/work/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
